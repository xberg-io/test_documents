    <rect x="300" y="224" width="140" height="26" rx="4" fill="#eaf6e4" stroke="#b2df8a"/>
    <text x="310" y="241">Images — 28%</text>
    <rect x="300" y="254" width="140" height="26" rx="4" fill="#fdeeee" stroke="#fb9a99"/>
