  </g>

  <g stroke="#777777" stroke-width="1" fill="none">
    <polyline points="196,120 232,95 300,95"/>
    <polyline points="76,131 44,60 300,60"/>
    <polyline points="243,215 268,237 300,237"/>
    <polyline points="96,232 72,267 300,267"/>
  </g>
  <g fill="#777777">
    <circle cx="196" cy="120" r="2.5"/>
    <circle cx="76" cy="131" r="2.5"/>
    <circle cx="243" cy="215" r="2.5"/>
    <circle cx="96" cy="232" r="2.5"/>
  </g>

  <g font-family="Helvetica, sans-serif" font-size="12" fill="#111111">
    <rect x="300" y="82" width="140" height="26" rx="4" fill="#eef6fb" stroke="#a6cee3"/>
    <text x="310" y="99">PDF — 34%</text>
    <rect x="300" y="47" width="140" height="26" rx="4" fill="#fdf3e7" stroke="#fdbf6f"/>
