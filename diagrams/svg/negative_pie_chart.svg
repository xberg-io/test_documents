<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="460" height="300" viewBox="0 0 460 300">
  <title>Storage used by file type</title>
  <rect x="0" y="0" width="460" height="300" fill="white"/>
  <text x="20" y="28" font-family="Helvetica, sans-serif" font-size="15" font-weight="bold">Storage used by file type</text>

  <g transform="translate(150,170)" stroke="white" stroke-width="2">
    <path d="M0,0 L0,-90 A90,90 0 0,1 85.6,-27.8 Z" fill="#a6cee3"/>
    <path d="M0,0 L85.6,-27.8 A90,90 0 0,1 27.8,85.6 Z" fill="#b2df8a"/>
