<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored positive with company. One page holding a heading, two paragraphs of prose, a
     ruled table and, at the bottom, a single three-node diagram. Every other fixture in this set
     is entirely a diagram or entirely not one; this one is both, so recovery has to be selective
     within a page rather than deciding once per file. The ground truth is the bottom diagram
     alone, and the table's cells and rules must contribute nothing. -->
<svg xmlns="http://www.w3.org/2000/svg" width="540" height="520" viewBox="0 0 540 520">
  <title>Release checklist</title>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="540" height="520" fill="white"/>

  <text x="32" y="42" font-family="Helvetica, sans-serif" font-size="17" font-weight="bold">Release checklist</text>
  <g font-family="Helvetica, sans-serif" font-size="12" fill="#222222">
    <text x="32" y="70">Every release goes through the same three stages. The table below records</text>
    <text x="32" y="88">who signs off on each one, and the diagram at the foot of the page shows the</text>
    <text x="32" y="106">order they run in.</text>
  </g>

  <g stroke="#333333" stroke-width="1" fill="none">
    <rect x="32" y="130" width="476" height="128"/>
    <line x1="32" y1="162" x2="508" y2="162"/>
    <line x1="32" y1="194" x2="508" y2="194"/>
    <line x1="32" y1="226" x2="508" y2="226"/>
    <line x1="220" y1="130" x2="220" y2="258"/>
    <line x1="368" y1="130" x2="368" y2="258"/>
  </g>
  <g font-family="Helvetica, sans-serif" font-size="12" fill="#111111">
    <g font-weight="bold">
      <text x="44" y="151">Stage</text>
      <text x="232" y="151">Owner</text>
      <text x="380" y="151">Deadline</text>
    </g>
    <text x="44" y="183">Build</text>
    <text x="232" y="183">Release engineer</text>
    <text x="380" y="183">Monday</text>
    <text x="44" y="215">Sign-off</text>
    <text x="232" y="215">Product lead</text>
    <text x="380" y="215">Wednesday</text>
    <text x="44" y="247">Ship</text>
    <text x="232" y="247">On-call</text>
    <text x="380" y="247">Thursday</text>
  </g>

  <g font-family="Helvetica, sans-serif" font-size="12" fill="#222222">
    <text x="32" y="298">A stage may only start once the one before it has been signed off:</text>
  </g>

  <g fill="#e8eef7" stroke="#33518a" stroke-width="1.4">
    <rect x="52" y="340" width="120" height="52" rx="6"/>
    <rect x="210" y="340" width="120" height="52" rx="6"/>
    <rect x="368" y="340" width="120" height="52" rx="6"/>
  </g>
  <g font-family="Helvetica, sans-serif" font-size="13" fill="#111111" text-anchor="middle">
    <text x="112" y="371">Build</text>
    <text x="270" y="371">Sign-off</text>
    <text x="428" y="371">Ship</text>
  </g>
  <g stroke="#333333" stroke-width="1.4" marker-end="url(#tip)">
    <line x1="172" y1="366" x2="204" y2="366"/>
    <line x1="330" y1="366" x2="362" y2="366"/>
  </g>

  <g font-family="Helvetica, sans-serif" font-size="11" fill="#555555">
    <text x="32" y="440">Figure 1. Release stages, in order.</text>
  </g>
</svg>
