<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored negative control. A printed form: captions beside empty boxes, section rules,
     a row of checkboxes and a signature line. Every ingredient of a diagram is present: closed
     outlines, text, long straight strokes touching the outlines, and there is no graph. The
     underline rules in particular run right up to the boxes, which is what an edge looks like. -->
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="330" viewBox="0 0 500 330">
  <title>Access request form</title>
  <rect x="0" y="0" width="500" height="330" fill="white"/>

  <text x="24" y="32" font-family="Helvetica, sans-serif" font-size="16" font-weight="bold">Access request</text>
  <line x1="24" y1="42" x2="476" y2="42" stroke="#111111" stroke-width="2"/>

  <g font-family="Helvetica, sans-serif" font-size="12" fill="#111111">
    <text x="24" y="72">Full name</text>
    <text x="24" y="112">Team</text>
    <text x="24" y="152">Manager</text>
    <text x="24" y="206">Systems requested</text>
    <text x="24" y="300">Signature</text>
  </g>

  <g fill="none" stroke="#555555" stroke-width="1">
    <rect x="120" y="58" width="356" height="20"/>
    <rect x="120" y="98" width="356" height="20"/>
    <rect x="120" y="138" width="356" height="20"/>
    <line x1="24" y1="176" x2="476" y2="176"/>
    <rect x="24" y="222" width="14" height="14"/>
    <rect x="140" y="222" width="14" height="14"/>
    <rect x="256" y="222" width="14" height="14"/>
    <rect x="372" y="222" width="14" height="14"/>
    <line x1="24" y1="262" x2="476" y2="262"/>
    <line x1="120" y1="304" x2="476" y2="304"/>
  </g>

  <g font-family="Helvetica, sans-serif" font-size="12" fill="#111111">
    <text x="46" y="234">Mail</text>
    <text x="162" y="234">Repository</text>
    <text x="278" y="234">Dashboards</text>
    <text x="394" y="234">Billing</text>
  </g>
</svg>
