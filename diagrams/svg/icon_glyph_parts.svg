    <rect x="16" y="0" width="24" height="16"/>
  </g>
  <text x="388" y="132" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="12">Router</text>

  <g transform="translate(520,58)" fill="#b279a2">
