<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180">
  <title>Content delivery path</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="180" fill="white"/>

  <g transform="translate(48,58)" fill="#4c78a8">
    <rect x="0" y="14" width="56" height="38"/>
    <path d="M0,18 L28,0 L56,18 Z"/>
  </g>
  <text x="76" y="132" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="12">Gateway</text>

  <g transform="translate(200,58)" fill="#f58518">
    <rect x="0" y="12" width="52" height="40"/>
    <ellipse cx="26" cy="12" rx="26" ry="10"/>
  </g>
  <text x="226" y="132" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="12">Cache</text>

  <g transform="translate(360,58)" fill="#54a24b">
