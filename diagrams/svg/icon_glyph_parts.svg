    <ellipse cx="30" cy="16" rx="30" ry="9"/>
  </g>
  <text x="550" y="132" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="12">Archive</text>

  <g stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="114" y1="86" x2="190" y2="86"/>
    <line x1="262" y1="86" x2="354" y2="86"/>
    <line x1="422" y1="86" x2="510" y2="86"/>
