apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: commerce
  labels:
    app: orders-api
    tier: backend
    version: "3.1.2"
  annotations:
    kubernetes.io/change-cause: "Roll out connection-pool tuning"
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
        tier: backend
    spec:
      serviceAccountName: orders-api-sa
      containers:
        - name: orders-api
          image: registry.example.com/commerce/orders-api:3.1.2
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orders-db
                  key: url
            - name: LOG_LEVEL
              value: "info"
            - name: MAX_POOL_SIZE
              value: "32"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
        - name: log-shipper
          image: registry.example.com/infra/fluent-bit:2.2
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
