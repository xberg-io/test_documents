name: Unit tests

# ~keep Deliberately NOT path-filtered, unlike xberg-io/actions' own test-unit.yml. Most pull
# requests here add corpus documents and touch nothing under scripts/, and a path-filtered workflow
# that does not run leaves a required status check pending forever — which would block every
# corpus-addition PR. The suite is ~190 network-free tests that finish in about a second.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ~keep Floor and ceiling. 3.10 is the declared requires-python and the version at which
        # PEP 604 unions must evaluate at runtime now that the future import is gone; 3.14 is what
        # maintainers run locally. The bare `python3` the manifest job uses sits between them.
        # The label stays the minor line so the check names do not change; mise.ci.toml locks each
        # leg's exact version. ~keep
        python-version: ["3.10", "3.14"]
        include:
          - python-version: "3.10"
            mise-python: "3.10.22"
          - python-version: "3.14"
            mise-python: "3.14.10"
    env:
      MISE_ENV: ci
      MISE_PYTHON_VERSION: ${{ matrix.mise-python }}
      # uv must use the interpreter mise installed, not download its own. ~keep
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v7

      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python uv

      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.mise-python }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-${{ matrix.mise-python }}-

      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: Run tests
        run: uv run pytest -v

      # ~keep The suite is unittest.TestCase on purpose, so the zero-install runner has to keep
      # working. This is the same guarantee verify-corpus.yaml defends, one level up. It runs the
      # runner's own /usr/bin/python3, not the mise leg on PATH: the 3.10 leg has no tomllib.
      - name: Run the same tests with no installs at all
        run: /usr/bin/python3 -m unittest discover -s scripts/tests -t scripts -v

  lint:
    name: ruff
    runs-on: ubuntu-latest
    env:
      # uv must use the interpreter mise installed, not download its own. ~keep
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v7

      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python uv

      - name: Resolve the mise Python version
        id: python
        run: echo "version=$(python3 -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"

      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ steps.python.outputs.version }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-${{ steps.python.outputs.version }}-

      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # ~keep Type-checking is not here. The polyrepo type-checks with pyrefly, which poly runs in
      # its whole-project phase — so `poly lint .` in validate.yml covers it, and that workflow
      # already sets setup-python precisely so pyrefly can resolve imports.

      # ~keep The belt for the config's braces. `ruff check` without --fix and `ruff format --check`
      # cannot write, so this should never trip — which is exactly why it is cheap to keep. If a
      # future edit to this job drops a --check or adds a --fix, this turns a silently corrupted
      # fixture into a red build instead of a merged one.
      - name: Nothing was rewritten
        run: git diff --exit-code

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: actionlint
      - run: actionlint
