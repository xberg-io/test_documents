name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    uses: xberg-io/actions/.github/workflows/reusable-validate.yml@v1
    with:
      setup-python: true
      # ~keep Pinned to the declared floor rather than the workflow's default. poly resolves its
      # Python checks against whatever interpreter it is handed, so pinning 3.10 turns
      # `requires-python = ">=3.10"` into something CI actually enforces — which matters now that
      # `from __future__ import annotations` is banned and PEP 604 unions evaluate at runtime.
      python-version: "3.10"
      # ~keep Pinned. Left empty this resolves "latest" through the GitHub API on every run, and one
      # rate-limited request kills the job before it lints anything. It also stops a poly release
      # changing what this gate enforces without a commit here.
      poly-version: "v0.21.10"
