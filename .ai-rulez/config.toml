version = "5.0"
name = "test_documents"
description = "Shared document corpus and ground truth used as test fixtures across the xberg polyrepo. A fixture corpus, not a codebase: the binaries live in a public GCS bucket and are pinned by corpus.lock.json."
gitignore = true

presets = ["claude", "codex", "opencode"]

compact = true

# ~keep `documentation` is on because most changes here are provenance prose (LICENSES.md,
# ATTRIBUTIONS.md, *_PROVENANCE.md) rather than code; there are no ADRs. Python conventions for
# scripts/ are the local `python` rule, not the `python` builtin (which prescribes mypy/pyright).
# CI/CD guidance comes from the xberg-cicd include.
builtins = [
  "!agent-delegation",
  "!ai-governance/agent-workflow",
  "!git-workflow",
  "!testing/test-alongside-code",
  "!documentation/adr-immutability",
  "documentation",
  "default-commands",
]

default_layers = ["plugins"]

[[includes]]
name = "xberg-core"
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "6e7f6a6793ea7380b916367e10a8acd13c3afbc3"
path = "modules/core"
merge_strategy = "local-override"

[[includes]]
name = "xberg-cicd"
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "6e7f6a6793ea7380b916367e10a8acd13c3afbc3"
path = "modules/cicd"
merge_strategy = "local-override"

[[includes]]
name = "xberg-document-corpora"
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "6e7f6a6793ea7380b916367e10a8acd13c3afbc3"
path = "modules/document-corpora"
merge_strategy = "local-override"

[header]
style = "minimal"

[defaults]
effort = "medium"

[mcp]
self_server_command = ["ai-rulez", "mcp"]
# ~keep Skill discovery only: the full server lists 67 tools (~38k tokens of schema) at every session start.
serve_skills = true
read_only = true
discover_skills = "repo"
tools = ["find_skill", "load_skill"]

[codex]
project_doc_max_bytes = 65536

[lock]
include_outputs = false

[rules]
# ~keep Glob-scoped rules stay out of AGENTS.md: rule files for Claude, path-gated skills for Codex.
scoped_fallback = "skill"
